<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18+ Age Verification</title>
    <style>
        /* Style for the overlay and modal */
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            margin: 0;
            padding: 0;
            height: 100%;
        }
        img{
            display: block;
            width: 100%;
            height: auto;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;    
        }

        .modal {
            background-color: black;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            width: 300px;
            box-shadow: 0px 4px 10px rgba(255, 145, 1, 0.5);
            
            transition: box-shadow 1s ease;
        }
        .modal:hover{
            transition: transform 1s ease;
            transition: transform 0.5s ease-out;
            transform: translateY(-10px);
            box-shadow: 0px 4px 10px rgba(255, 145, 1, 1);
        }

        .modal h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .modal p {
            margin-bottom: 20px;
        }

        .modal button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: orangered;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal button:hover {
            background-color: rgb(206, 61, 9);
        }
    </style>
</head>
<body>
    <img  src="0e27bf4e-a235-4c47-8481-44ce4b29213a.png">

<!-- Overlay for Age Verification Modal -->
<div id="ageVerificationModal" class="overlay">
    <div class="modal">
        <h2 style="color: white;">Age Verification</h2>
        <p style="color: white;">You must be 18 or older to view this content.</p>
        <button onclick="verifyAge()">I am 18 or older</button>
    </div>
</div>

<script>
    // Show the age verification modal when the page loads
    window.onload = function() {
        document.getElementById("ageVerificationModal").style.visibility = "visible";
    }

    // Function to verify age and hide the modal
    function verifyAge() {
        var isAdult = confirm("Are you 18 or older?");
        if (isAdult) {
            document.getElementById("ageVerificationModal").style.visibility = "hidden";
            window.location.href = "index.html";
        } else {
            alert("Sorry, you must be 18 or older to access this content.");
            window.location.href = "https://www.google.com"; // Redirect to a different page if not 18
        }
    }
</script>

</body>
</html>
